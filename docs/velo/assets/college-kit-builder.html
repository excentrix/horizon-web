  /* ---- builder chrome (bld- prefixed so it can't touch the document styles) ---- */
  :root{--b-paper:#FDF8EC;--b-ink:#212121;--b-char:#414141;--b-muted:#6f6a5e;--b-indigo:#5858CC;--b-energy:#EC5B13;--b-line:#E4DBCB;--b-panel:#fff;--b-bg:#EFE9DB;
    --disp:'Bricolage','Segoe UI',system-ui,sans-serif;--body:'Instrument','Segoe UI',system-ui,sans-serif;--mono:'GeistMono',ui-monospace,monospace}
  *{box-sizing:border-;margin:0;padding:0}
  .bld{font-family:var(--body);color:var(--b-ink);background:var(--b-bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
  .bld-top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--b-paper);border-bottom:1px solid var(--b-line);flex:none}
  .bld-brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.02em}
  .bld-brand svg{width:24px;height:24px}
  .bld-brand small{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--b-muted)}
  .bld-tabs{display:flex;gap:4px;margin-left:8px}
  .bld-tab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--b-char);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 12px;cursor:pointer}
  .bld-tab:hover{background:#0000000a}
  .bld-tab.on{background:var(--b-indigo);color:#fff}
  .bld-spacer{flex:1}
  .bld-zoom{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--b-muted);margin-right:6px}
  .bld-zoom button{font-family:var(--mono);font-size:12px;width:26px;height:26px;border:1px solid var(--b-line);background:var(--b-panel);border-radius:7px;cursor:pointer;color:var(--b-ink)}
  .bld-btn{font-family:var(--body);font-weight:500;font-size:12.5px;border:1px solid var(--b-line);background:var(--b-panel);color:var(--b-ink);border-radius:9px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .bld-btn:hover{border-color:#0003}
  .bld-btn.primary{background:var(--b-energy);border-color:var(--b-energy);color:#fff}
  .bld-btn.primary:hover{filter:brightness(1.05)}
  .bld-btn.ghost{background:transparent}

  .bld-shell{flex:1;display:flex;min-height:0}
  .bld-side{width:390px;flex:none;background:var(--b-paper);border-right:1px solid var(--b-line);overflow-y:auto;padding:6px 40px}
  .bld-group{border-bottom:1px solid var(--b-line)}
  .bld-gh{width:100%;text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--b-indigo);background:transparent;border:0;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .bld-gh .chev{transition:transform .18s;color:var(--b-muted)}
  .bld-group.closed .chev{transform:rotate(-90deg)}
  .bld-gb{padding:2px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .bld-group.closed .bld-gb{display:none}
  .bld-f{display:flex;flex-direction:column;gap:5px}
  .bld-f label{font-size:11px;font-weight:500;color:var(--b-char)}
  .bld-f .hint{font-size:10px;color:var(--b-muted);font-family:var(--mono);line-height:1.4}
  .bld-f input,.bld-f textarea,.bld-f select{font-family:var(--body);font-size:12.5px;color:var(--b-ink);background:var(--b-panel);border:1px solid var(--b-line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
  .bld-f textarea{font-family:var(--mono);font-size:11.5px;line-height:1.5;min-height:64px}
  .bld-f input:focus,.bld-f textarea:focus,.bld-f select:focus{outline:none;border-color:var(--b-indigo);box-shadow:0 0 0 3px #5858cc22}
  .bld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bld-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .bld-scores{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
  .bld-scores label{font-size:11.5px;color:var(--b-char)}
  .bld-scores input{width:64px;text-align:right}

  .bld-main{flex:1;min-width:0;overflow:auto;background:var(--b-bg);padding:28px;display:flex;justify-content:center;align-items:flex-start}
  .bld-doc{transform-origin:top center}
  .bld-doc .rp{box-shadow:0 24px 60px -30px rgba(33,33,33,.3)}

  @media print{
    .bld-top,.bld-side,.bld-zoom{display:none!important}
    .bld,.bld-shell,.bld-main{display:block;height:auto;overflow:visible;background:#fff;padding:0}
    .bld-doc{transform:none!important}
    .bld-doc .rp{box-shadow:none}
  }
</style>
</head>

  <div class="bld-top">
    <div class="bld-brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="bm"><circle cx="50" cy="50" r="46" fill="#fff"/><path d="M-8 70 Q50 24 108 70 L108 52 Q50 6 -8 52 Z" fill="#000"/></mask></defs><rect width="100" height="100" fill="#EC5B13" mask="url(#bm)"/></svg>
      <span>VELO Kit<br><small>Document builder</small></span>

    <button class="bld-btn ghost" id="reset" title="Reset this document to sample defaults">Reset</button>
    <button class="bld-btn" id="dl">Download HTML</button>

</div>

const SHARED = `
:root{--paper:#FDF8EC;--cream:#FAEDCD;--ink:#212121;--charcoal:#414141;--muted:#6f6a5e;--indigo:#5858CC;--indigo-soft:#9a9ae4;--energy:#EC5B13;--line:#E1D7C4;--card:#fff;--track:#EFE7D6;--disp:'Bricolage','Segoe UI',system-ui,sans-serif;--body:'Instrument','Segoe UI',system-ui,sans-serif;--mono:'GeistMono',ui-monospace,monospace}
.rp *{box-sizing:border-box}
.rp{background:var(--paper);color:var(--charcoal);font-family:var(--body);font-size:12.5px;line-height:1.45;-webkit-font-smoothing:antialiased;width:840px;margin:0 auto;padding:38px 46px 28px;border:1px solid var(--line);border-radius:14px}
.rp h1,.rp h2,.rp h3{font-family:var(--disp);color:var(--ink);letter-spacing:-.02em;margin:0;line-height:1.08;text-wrap:balance}
.rp .eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin:0;display:inline-flex;align-items:center;gap:7px}
.rp .dot{width:6px;height:6px;border-radius:50%;background:var(--energy);display:inline-block}
.rp .section-title{font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.18em;color:var(--indigo);margin:34px 0 14px}
.rp .sec{margin-top:32px}
.rp .mono{font-family:var(--mono)}.rp .tnum{font-variant-numeric:tabular-nums}
.rp .mast{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.rp .brand{display:flex;align-items:center;gap:11px}
.rp .mark{width:32px;height:32px;flex:none}
.rp .wordmark{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink);line-height:1}
.rp .kicker{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-top:4px}
.rp .mast-meta{text-align:right;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;line-height:1.65;color:var(--charcoal)}
.rp .mast-meta .tag{color:var(--energy)}
.rp .sample-tag{display:inline-block;color:var(--energy);border:1px solid rgba(236,91,19,.4);border-radius:5px;padding:2px 6px;letter-spacing:.14em}
.rp .fill{color:var(--indigo)}
.rp .rule{height:1px;background:var(--line);border:0;margin:16px 0}
.rp .summary{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--cream);border-radius:12px;padding:16px 20px}
.rp .summary h1{font-size:22px;font-weight:600;margin:6px 0 4px}
.rp .summary .sub{font-size:12px;color:var(--charcoal);margin:0}.rp .summary .sub b{color:var(--ink)}
.rp .verdict{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.rp .pill{display:inline-flex;align-items:center;gap:7px;background:var(--indigo);color:#fff;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.04em;padding:7px 13px;border-radius:20px;white-space:nowrap}
.rp .pill .pd{width:7px;height:7px;border-radius:50%;background:#fff}
.rp .samplesize{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.rp .foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.rp .foot p{font-size:10.5px;line-height:1.5;color:var(--muted);margin:0 0 6px}.rp .foot b{color:var(--charcoal);font-weight:600}
.rp .doctrine{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--indigo);margin:8px 0 0}
.rp code{font-family:var(--mono);font-size:11px;background:var(--cream);padding:1px 5px;border-radius:4px;color:var(--ink)}
@media print{
  @page{size:auto;margin:0}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  .rp{
    margin:0 auto!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    width:840px!important;
    max-width:none!important;
    transform:none!important;
    zoom:1!important;
    break-inside:avoid;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact
  }
}`;

.rp .tile.gap .tile-k,.rp .tile.gap .tile-k .kd{color:var(--energy)}.rp .tile.gap .tile-k .kd{background:var(--energy)}.rp .tile.gap .chip b{color:var(--energy)}

.rp .pilot{margin-top:20px;padding:17px 22px;border:1.5px solid var(--indigo);border-radius:12px;background:linear-gradient(180deg,rgba(236,91,19,.05),rgba(236,91,19,0))}
.rp .pilot h2{font-size:18px;font-weight:600;margin:5px 0 7px}.rp .pilot p{margin:0;font-size:12px;line-height:1.45;color:var(--charcoal)}.rp .pilot b{color:var(--ink)}

.rp .contact{display:flex;flex-wrap:wrap;gap:5px 20px;font-family:var(--mono);font-size:11px;color:var(--charcoal)}`;

    <div class="kpi accent"><div class="n tnum">${esc(h.kReadyPct)}<span class="u">%</span></div><div class="k">Placement-ready<br>(mid-level or above)</div></div>
    <div class="kpi"><div class="n tnum">${esc(h.kProjects)}</div><div class="k">Real projects<br>interrogated</div></div>
    <div class="kpi"><div class="n tnum">${esc(h.kCompletion)}<span class="u">%</span></div><div class="k">Completed the<br>verification</div></div></div></section>
  <section class="sec twocol">
    <div><h2 class="section-title">Readiness distribution</h2><div class="bars">
      ${distRow('Senior-ready',+h.distSenior,false)}${distRow('Mid-ready',+h.distMid,false)}${distRow('Junior-ready',+h.distJunior,true)}${distRow('Not yet ready',+h.distNot,true)}</div>
      <div class="legend"><span><i style="background:#5858CC"></i>Placement-ready (${ready})</span><span><i style="background:#9a9ae4"></i>Needs work (${needs})</span></div></div>
    <div><h2 class="section-title">Cohort dimension averages</h2><div class="bars">
      ${meterRow('Ownership depth',+h.own)}${meterRow('Technical judgment',+h.judg)}${meterRow('Debugging / failure',+h.debug)}${meterRow('Honesty signal',+h.honest)}${meterRow('Communication',+h.comm)}</div></div></section>
  <section class="sec"><h2 class="section-title">Top knowledge gaps across the cohort — the training targets</h2><div class="bars">${gaps}</div>
    <p class="sub" style="font-size:11.5px;color:var(--muted);margin:12px 0 0">% of verified students who couldn’t defend this area under questioning. The gaps above half the batch are the highest-leverage things to teach before the season.</p></section>
  <section class="sec"><h2 class="section-title">Showcase shortlist — verified students to send recruiters</h2>
    <div class="list"><div class="lrow head"><span>Student</span><span>Readiness</span><span class="strong">Strongest, verified</span><span>Projects</span></div>${rows}</div>
    <p class="sub" style="font-size:11.5px;color:var(--muted);margin:12px 0 0">Anonymized here. Each name links to that student’s full report — the transcript and the code VELO read — so a recruiter re-judges in two minutes.</p></section>
  <section class="sec rec"><div class="train"><h3>Train the batch on</h3><ul>${train}</ul></div><div class="show"><h3>Showcase now</h3><ul>${show}</ul></div></section>
  <footer class="foot"><p><b>How to read this.</b> Every number rolls up from individual reports you can open — each ships with the student’s full interrogation transcript and the exact source files VELO read. Auditable, not authoritative; the bar is calibrated to <b>fail, not flatter</b>.</p>
    <p>This is an <b>anonymized sample</b> cohort; students, scores and distributions are illustrative.</p>
    <p class="doctrine">Verify free · fail privately · showcase only what you’re proud of</p></footer></article>`;
}

const RENDER={onepager:renderOnepager, profile:renderProfile, cohort:renderCohort};
const DOCS=[['onepager','One-pager'],['profile','Profile report'],['cohort','Cohort report']];

/* ============================== form schema ============================== */

/* ============================== state ============================== */
let D = load() || JSON.parse(JSON.stringify(DEFAULTS));
let cur = 'onepager';
let zoom = 0.75;

function load(){try{const s=localStorage.getItem('velo-kit');return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){try{localStorage.setItem('velo-kit',JSON.stringify(D));}catch(e){}}
function get(path){return path.split('.').reduce((o,k)=>o&&o[k],D);}
function set(path,v){const ks=path.split('.');let o=D;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}

/* ============================== build form ============================== */
function field(spec){
  const [path,label,type,opts,ph]=spec;
  if(path==='@scores.profile') return scoreGrid(['own','Ownership','judg','Technical judgment','debug','Debugging','honest','Honesty','comm','Communication'],'profile')+seniorSel('profile');
  if(path==='@scores.cohort') return scoreGrid(['own','Ownership','judg','Technical judgment','debug','Debugging','honest','Honesty','comm','Communication'],'cohort');
  if(path==='@kpis') return kpiGrid();
  if(path==='@dist') return distGrid();
  const val=esc(get(path));
  const hint = (type==='textarea'&&opts==='h')?`<div class="hint">${esc(label)}</div>`:'';
  const lab = (type==='textarea'&&opts==='h')?'':`<label>${esc(label)}</label>`;
  let input;
  if(type==='textarea') input=`<textarea data-k="${path}" rows="3">${val}</textarea>`;
  else if(type==='select') input=`<select data-k="${path}">${opts.map(o=>`<option${o===get(path)?' selected':''}>${o}</option>`).join('')}</select>`;
  else input=`<input data-k="${path}" value="${val}"${ph?` placeholder="${esc(ph)}"`:''}>`;
  return `<div class="bld-f">${lab}${hint}${input}</div>`;
}
function scoreGrid(pairs,doc){let h='<div class="bld-scores">';for(let i=0;i<pairs.length;i+=2){h+=`<label>${pairs[i+1]}</label><input type="number" min="0" max="100" data-k="${doc}.${pairs[i]}" value="${esc(get(doc+'.'+pairs[i]))}">`;}return h+'</div>';}
function seniorSel(doc){return `<div class="bld-f" style="margin-top:10px"><label>Seniority calibration</label><select data-k="${doc}.seniority">${['Junior','Mid','Senior'].map(o=>`<option${o===get(doc+'.seniority')?' selected':''}>${o}</option>`).join('')}</select></div>`;}
function kpiGrid(){const f=[['kVerified','Verified'],['kReadyPct','Ready %'],['kProjects','Projects'],['kCompletion','Completed %']];return '<div class="bld-row">'+f.map(([k,l])=>`<div class="bld-f"><label>${l}</label><input data-k="cohort.${k}" value="${esc(get('cohort.'+k))}"></div>`).join('')+'</div>';}
function distGrid(){const f=[['distSenior','Senior-ready'],['distMid','Mid-ready'],['distJunior','Junior-ready'],['distNot','Not yet']];return '<div class="bld-row">'+f.map(([k,l])=>`<div class="bld-f"><label>${l}</label><input type="number" min="0" data-k="cohort.${k}" value="${esc(get('cohort.'+k))}"></div>`).join('')+'</div>';}

function buildForm(){
  const groups=[...FORMS.common, ...FORMS[cur]];
  document.getElementById('form').innerHTML = groups.map((g,i)=>{
    const [title,fields]=g;
    return `<div class="bld-group${i>1?' closed':''}"><button class="bld-gh" data-g="${i}">${esc(title)}<span class="chev">▾</span></button><div class="bld-gb">${fields.map(field).join('')}</div></div>`;
  }).join('');
}

/* ============================== preview ============================== */
function renderPreview(){
  const main=document.getElementById('main-scroll');
  const st=main?main.scrollTop:0;
  const doc=document.getElementById('doc');
  doc.innerHTML = `<style>${SHARED+DOCCSS[cur]}</style>` + RENDER[cur]();
  doc.style.transform = `scale(${zoom})`;
  const wrap=doc.querySelector('.rp'); if(wrap){doc.style.width=(840*zoom)+'px'; doc.style.height=(wrap.offsetHeight*zoom)+'px';}
  if(main) main.scrollTop=st;
}
function rerender(){renderPreview();save();}

/* ============================== export ============================== */
function fnameBase(){const col=(D.common.college||'college').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();return `velo-${cur}-${col}`;}
function standaloneHTML(withBar){
  const body = RENDER[cur]();
  const bar = withBar ? `<div class="__pb"><span>Use <b>Save single-page PDF</b> for one continuous page, or <b>Print</b> if you want browser pagination.</span><div class="__pb-actions"><button type="button" id="__savepdf">Save single-page PDF</button><button type="button" id="__print">Print</button></div></div><style>@media screen{body{padding-top:64px}}@media print{.__pb{display:none!important}}.__pb{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;background:#212121;color:#fff;font-family:'Instrument',system-ui,sans-serif;font-size:14px;padding:12px 16px}.__pb b{font-weight:600}.__pb-actions{display:flex;gap:10px}.__pb button{font:inherit;font-weight:600;background:#EC5B13;color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}.__pb button#__print{background:#5858CC}</style>` : '';
  const exportScript = withBar ? `<script>
    (function(){
      async function load(src){
        return new Promise(function(resolve,reject){
          var s=document.createElement('script');
          s.src=src;
          s.onload=resolve;
          s.onerror=function(){reject(new Error('Failed to load '+src));};
          document.head.appendChild(s);
        });
      }
      async function saveSinglePagePdf(){
        var btn=document.getElementById('__savepdf');
        var bar=document.querySelector('.__pb');
        var prev=btn?btn.textContent:'';
        try{
          if(btn){btn.disabled=true;btn.textContent='Preparing…';}
          if(bar){bar.style.visibility='hidden';}
          await Promise.all([
            window.html2canvas ? Promise.resolve() : load('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),
            window.jspdf ? Promise.resolve() : load('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')
          ]);
          await document.fonts.ready;
          await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});
          var node=document.querySelector('.rp');
          var canvas=await window.html2canvas(node,{backgroundColor:'#FDF8EC',scale:2,useCORS:true,scrollX:0,scrollY:0});
          var jsPDF=window.jspdf&&window.jspdf.jsPDF;
          if(!jsPDF) throw new Error('jsPDF unavailable');
          var pxToMm=25.4/96;
          var pageW=canvas.width*pxToMm;
          var pageH=canvas.height*pxToMm;
          var pdf=new jsPDF({orientation:pageW>pageH?'l':'p',unit:'mm',format:[pageW,pageH],compress:true});
          pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pageW,pageH,undefined,'FAST');
          pdf.save(${JSON.stringify(fnameBase()+'.pdf')});
        }catch(err){
          alert('PDF export failed: '+(err&&err.message?err.message:err));
          console.error(err);
        }finally{
          if(bar){bar.style.visibility='';}
          if(btn){btn.disabled=false;btn.textContent=prev||'Save single-page PDF';}
        }
      }
      document.addEventListener('click',function(e){
        if(e.target&&e.target.id==='__print'){try{window.print()}catch(err){}}
        if(e.target&&e.target.id==='__savepdf'){saveSinglePagePdf();}
      });
    })();
  <\/script>` : '';
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fnameBase())}</title><style>${FONTFACE+SHARED+DOCCSS[cur]}</style></head><body style="margin:0;background:#fff">${bar}${body}${exportScript}</body></html>`;
}
function pdfExportHTML(){
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fnameBase())}</title><style>${FONTFACE+SHARED+DOCCSS[cur]}</style><style>
    body{margin:1rem;background:#d9d2c6;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:60px 0 120px}
    .sheet{margin:1rem;background:var(--paper);padding:0;border-radius:14px;box-shadow:0 10px 24px rgba(33,33,33,.16),0 2px 6px rgba(33,33,33,.08);overflow:hidden;display:inline-block}
    .rp{transform:none;zoom:1!important}
    .__status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Instrument',system-ui,sans-serif;font-size:14px;color:#666;background:#fff;z-index:5}
  </style></head><body><div class="sheet" id="wrap">${RENDER[cur]()}</div><div class="__status" id="status">Preparing PDF…</div>
  <script>
    (async function(){
      function load(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
      try{
        await Promise.all([
          load('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),
          load('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')
        ]);
        await document.fonts.ready;
        await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});
        var node=document.querySelector('.sheet');
        var canvas=await window.html2canvas(node,{backgroundColor:'#d9d2c6',scale:2,useCORS:true,scrollX:0,scrollY:0});
        var jsPDF=window.jspdf&&window.jspdf.jsPDF;
        if(!jsPDF) throw new Error('jsPDF unavailable');
        var pxToMm = 25.4 / 96;
        var pageW = canvas.width * pxToMm;
        var pageH = canvas.height * pxToMm;
        var pdf = new jsPDF({orientation:'p', unit:'mm', format:[pageW, pageH], compress:true});
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pageW, pageH, undefined, 'FAST');
        pdf.save(${JSON.stringify(fnameBase()+'.pdf')});
        setTimeout(function(){try{window.close()}catch(e){}},500);
      }catch(err){
        var s=document.getElementById('status');
        if(s){s.textContent='PDF export failed: '+(err&&err.message?err.message:err);}
        console.error(err);
      }
    })();
  <\/script></body></html>`;
}
function openStandalone(html){
  const w = window.open('about:blank', '_blank');
  if(!w) return false;
  w.document.open();
  w.document.write(html);
  w.document.close();
  try{w.document.title=fnameBase();}catch(e){}
  try{w.history.replaceState(null,'',fnameBase()+'.html');}catch(e){}
  try{w.focus();}catch(e){}
  return true;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function loadScriptOnce(src, check){
  if(check && check()) return Promise.resolve();
  const existing = [...document.scripts].find(s => s.src === src);
  if(existing){
    if((check && check()) || existing.dataset.loaded === 'true') return Promise.resolve();
    return new Promise((resolve,reject)=>{
      existing.addEventListener('load', ()=>{existing.dataset.loaded='true'; resolve();}, {once:true});
      existing.addEventListener('error', ()=>reject(new Error('Failed to load '+src)), {once:true});
    });
  }
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{s.dataset.loaded='true'; resolve();};
    s.onerror=()=>reject(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}
function makeExportMount(){
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.cssText='position:fixed;left:-100000px;top:0;z-index:-1;background:#fff;padding:0;margin:0;';
  host.innerHTML = `<style>${FONTFACE+SHARED+DOCCSS[cur]}</style>${RENDER[cur]()}`;
  document.body.appendChild(host);
  return host;
}
function downloadHTML(){
  downloadBlob(new Blob([standaloneHTML(false)], {type:'text/html;charset=utf-8'}), fnameBase()+'.html');
}
async function savePDF(){
  const btn=document.getElementById('pdf');
  const prev=btn?btn.textContent:'';
  let host=null;
  try{
    if(btn){btn.disabled=true;btn.textContent='Preparing PDF...';}
    await Promise.all([
      loadScriptOnce('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', ()=>!!window.html2canvas),
      loadScriptOnce('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', ()=>!!(window.jspdf&&window.jspdf.jsPDF))
    ]);
    await document.fonts.ready;
    host=makeExportMount();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const node=host.querySelector('.rp');
    const canvas=await window.html2canvas(node,{backgroundColor:'#FDF8EC',scale:2,useCORS:true,scrollX:0,scrollY:0});
    const jsPDF=window.jspdf&&window.jspdf.jsPDF;
    if(!jsPDF) throw new Error('jsPDF unavailable');
    const pxToMm=25.4/96;
    const pageW=canvas.width*pxToMm;
    const pageH=canvas.height*pxToMm;
    const pdf=new jsPDF({orientation:pageW>pageH?'l':'p',unit:'mm',format:[pageW,pageH],compress:true});
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pageW,pageH,undefined,'FAST');
    pdf.save(fnameBase()+'.pdf');
  }catch(err){
    alert('PDF export failed: '+(err&&err.message?err.message:err));
    console.error(err);
  }finally{
    if(host) host.remove();
    if(btn){btn.disabled=false;btn.textContent=prev||'Save PDF';}
  }
}

/* ============================== wire up ============================== */
function setZoom(z){zoom=Math.max(.4,Math.min(1.1,Math.round(z*100)/100));document.getElementById('zlab').textContent=Math.round(zoom*100)+'%';renderPreview();}
function init(){
  document.getElementById('tabs').innerHTML=DOCS.map(([k,l])=>`<button class="bld-tab${k===cur?' on':''}" data-doc="${k}">${l}</button>`).join('');
  // wrap main for scroll ref
  const main=document.querySelector('.bld-main'); main.id='main-scroll';
  buildForm(); renderPreview();
  document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-doc]');if(!b)return;cur=b.dataset.doc;document.querySelectorAll('.bld-tab').forEach(t=>t.classList.toggle('on',t.dataset.doc===cur));buildForm();renderPreview();};
  document.getElementById('form').addEventListener('input',e=>{const el=e.target.closest('[data-k]');if(!el)return;set(el.dataset.k, el.value);rerender();});
  document.getElementById('form').addEventListener('click',e=>{const h=e.target.closest('.bld-gh');if(!h)return;h.parentElement.classList.toggle('closed');});
  document.getElementById('zin').onclick=()=>setZoom(zoom+.1);
  document.getElementById('zout').onclick=()=>setZoom(zoom-.1);
  document.getElementById('dl').onclick=downloadHTML;
  document.getElementById('pdf').onclick=savePDF;
  document.getElementById('reset').onclick=()=>{if(confirm('Reset '+cur+' to sample defaults? Your other documents stay.')){D[cur]=JSON.parse(JSON.stringify(DEFAULTS[cur]));buildForm();rerender();}};
}
init();
</script>
